name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o dist/ .
      - if: runner.os != 'Windows'
        run: python3 test_pty.py
  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build archives
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p staging artifacts
          binary=agy-tap
          if [ "$GOOS" = windows ]; then binary=agy-tap.exe; fi
          go build -trimpath -ldflags="-s -w" -o "staging/$binary" .
          cp README.md LICENSE staging/
          if [ "$GOOS" = windows ]; then
            (cd staging && zip -q "../artifacts/agy-tap-${GOOS}-${GOARCH}.zip" ./*)
          else
            tar -czf "artifacts/agy-tap-${GOOS}-${GOARCH}.tar.gz" -C staging .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          tar -xzf agy-tap-linux-amd64.tar.gz
          test "$(./agy-tap --version)" = "agy-tap ${RELEASE_TAG#v}"
          sha256sum agy-tap-*.tar.gz agy-tap-*.zip > checksums.txt
          gh release create "$RELEASE_TAG" agy-tap-*.tar.gz agy-tap-*.zip checksums.txt --verify-tag --title "$RELEASE_TAG" --generate-notes
